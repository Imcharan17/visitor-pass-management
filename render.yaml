services:
  - type: web
    name: gatehouse-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm --prefix server run seed && npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: System Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: gatehouse-frontend
    runtime: static
    buildCommand: npm ci --prefix client && npm --prefix client run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gatehouse-api
          envVarKey: RENDER_EXTERNAL_URL
